<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Yangi O‘zbekiston yo‘llari — bo‘limlar</title>
<style>
:root{
  --tp-navy-900:#070d18;
  --tp-navy-800:#0b1526;
  --tp-navy-700:#101f38;
  --tp-navy-600:#16294a;
  --tp-line:rgba(212,175,110,.34);
  --tp-line-soft:rgba(212,175,110,.16);
  --tp-gold:#d8b26c;
  --tp-gold-hi:#f2dda8;
  --tp-gold-deep:#b98f45;
  --tp-sand:#e9dcc4;
  --tp-text:#dfd4bf;
  --tp-text-dim:rgba(223,212,191,.68);
  --tp-display:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --tp-body:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;
  --tp-shadow:0 1.2rem 3rem rgba(0,0,0,.55);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(0.55vw + 0.55vh);}
body{
  font-family:var(--tp-body);
  background:var(--tp-navy-900);
  color:var(--tp-text);
  height:100vh;width:100vw;overflow:hidden;
  user-select:none;-webkit-user-select:none;
  cursor:default;
}
img{display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ ЭКРАНЫ ============ */
.tp-screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transition:opacity .5s ease, visibility .5s;
  z-index:1;
}
.tp-screen.is-active{opacity:1;visibility:visible;z-index:5}

/* ============ ФОН ============ */
.tp-bg{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(130% 95% at 50% 0%, #14263f 0%, #0a1120 58%, #070d18 100%);
}
.tp-bg__img{
  /* кадр 9:16 — точно под вертикальный экран 1080x1920, без обрезки */
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  transform:none;
  -webkit-mask-image:none;mask-image:none;
  transition:opacity 1s ease, filter 1s ease, transform 1s ease;
}
@media (orientation:landscape){
  .tp-bg__img{object-position:50% 42%;transform:scale(1.04)}
}
.tp-bg__veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(7,13,24,.45) 0%, rgba(7,13,24,.04) 34%, rgba(7,13,24,.30) 66%, rgba(7,13,24,.86) 100%);
  transition:opacity 1s ease;
}
.tp-bg__grain{
  position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.25) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px);
}
body.tp-mode-inner .tp-bg__img{opacity:.42;filter:blur(1.2px) saturate(.9)}
body.tp-mode-inner .tp-bg__veil{
  background:
    linear-gradient(180deg, rgba(5,10,20,.34) 0%, rgba(6,12,22,.46) 24%, rgba(6,12,22,.76) 44%, rgba(5,10,20,.90) 64%, rgba(5,10,20,.95) 100%);
}

/* ============ ОРНАМЕНТ ============ */
.tp-orn{display:flex;align-items:center;justify-content:center;gap:1.4rem;width:100%}
.tp-orn__line{height:1px;flex:0 1 14rem;background:linear-gradient(90deg,transparent,var(--tp-line))}
.tp-orn__line--r{background:linear-gradient(90deg,var(--tp-line),transparent)}
.tp-orn svg{width:2.2rem;height:2.2rem;fill:none;stroke:var(--tp-gold);stroke-width:5;opacity:.9}

/* ============ ЭКРАН 1 — ЯЗЫК ============ */
#tp-splash{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:2rem 3rem 3rem;text-align:center;gap:0}

.tp-splash__top{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:2rem;
  width:100%;
  padding:1.4rem 2.8rem;
  background:linear-gradient(135deg, rgba(16, 31, 56, 0.78) 0%, rgba(11, 22, 40, 0.62) 50%, rgba(7, 14, 26, 0.85) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(212,175,110,.35);
  border-radius:1.6rem;
  box-shadow:0 1rem 3rem rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.12);
  animation:tp-fade-down .9s .1s both;
  flex-shrink:0;
}
.tp-splash__top .tp-orn{display:none}
.tp-logo{
  width:7.5rem;height:auto;
  flex:0 0 auto;
  filter:drop-shadow(0 .6rem 1.6rem rgba(0,0,0,.75));
}
.tp-org{
  display:flex;
  flex-direction:column;
  text-align:left;
  font-family:var(--tp-body);
  font-size:1.45rem;
  line-height:1.4;
  letter-spacing:.12em;
  color:var(--tp-sand);
  text-transform:uppercase;
  font-weight:500;
}
.tp-org b{
  display:block;
  font-family:var(--tp-display);
  font-weight:700;
  color:var(--tp-gold-hi);
  font-size:1.3em;
  line-height:1.3;
  letter-spacing:.18em;
  margin-top:.4rem;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}

.tp-splash__mid{display:flex;flex-direction:column;align-items:center;gap:.4rem;margin-top:-80%;transform:translateY(-1rem);flex:1;justify-content:center;animation:tp-fade-up 1s .5s both}
.tp-hero{
  font-family:var(--tp-display);
  font-weight:700;
  font-size:4.8rem;line-height:1.05;
  letter-spacing:.07em;
  background:linear-gradient(180deg,#fbfbfb 0%,#fff5e3 45%,#ffc257 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0.2rem 0.4rem rgba(0, 0, 0, 0.512),
              0 0.4rem 1.2rem rgba(0, 0, 0, 0.688),
              0 0 2.2rem rgba(0,0,0,.7);  text-shadow:0 .4rem 3rem rgba(0, 0, 0, 0.723);
}
.tp-hero__sup{
  font-family:var(--tp-display);
  font-weight:600;
  font-size:2.2rem;letter-spacing:.46em;color:var(--tp-sand);
  text-transform:uppercase;margin-bottom:.2rem;padding-left:.46em;
  text-shadow:0 0.15rem 0.3rem rgba(0,0,0,.45);
}
.tp-hero__sub{
  font-family:var(--tp-display);
  font-weight:600;
  font-size:2.4rem;letter-spacing:.44em;color:var(--tp-gold-hi);
  text-transform:uppercase;margin-top:.2rem;padding-left:.44em;
  text-shadow:0 0.15rem 0.3rem rgba(0,0,0,.45);
}

.tp-splash__bot{display:flex;flex-direction:column;align-items:center;gap:2rem;width:100%;margin-top:auto;padding-top:1.5rem}
.tp-choose{
  font-size:1.5rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--tp-text-dim);
  animation:tp-fade-up 1s .7s both;
}
.tp-langs{display:flex;gap:3rem;justify-content:center;flex-wrap:nowrap;width:100%;max-width:100%}
.tp-git{
  padding:.8rem 1.6rem;
  border:1px solid var(--tp-line);
  border-radius:999px;
  font-size:1rem;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--tp-sand);
  background:rgba(255,255,255,.04);
  box-shadow:0 .6rem 1.4rem rgba(0,0,0,.25);
  animation:tp-fade-up 1s .95s both;
}
.tp-git:hover{border-color:var(--tp-gold);background:rgba(216,178,108,.12)}

.tp-lang{
  position:relative;
  width:19rem;height:15.5rem;
  max-width:calc(33vw - 2rem);
  flex:0 1 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:.5rem;padding-bottom:2.4rem;
  background:linear-gradient(180deg,rgba(16,31,56,.62),rgba(8,15,28,.82));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid var(--tp-line);
  border-radius:9.5rem 9.5rem 1.2rem 1.2rem;
  box-shadow:var(--tp-shadow), inset 0 0 4rem rgba(216,178,108,.06);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.2), box-shadow .28s, border-color .28s, background .28s;
  animation:tp-fade-up .9s both;
}
.tp-lang:nth-child(1){animation-delay:.85s}
.tp-lang:nth-child(2){animation-delay:.97s}
.tp-lang:nth-child(3){animation-delay:1.09s}
.tp-lang:active{transform:scale(.965)}
.tp-lang:hover{border-color:rgba(212,175,110,.85);box-shadow:0 1.4rem 3.6rem rgba(0,0,0,.6),0 0 3rem rgba(216,178,108,.22),inset 0 0 4rem rgba(216,178,108,.12)}
.tp-lang__code{
  font-family:var(--tp-display);
  font-weight:700;
  font-size:3.9rem;letter-spacing:.14em;
  color:var(--tp-gold-hi);
  margin-top:auto;padding-top:3.2rem;
}
.tp-lang__name{font-size:1.42rem;letter-spacing:.3em;text-transform:uppercase;color:var(--tp-text-dim)}
.tp-lang__flagline{width:5rem;height:1px;background:var(--tp-line);margin:.9rem 0 .2rem}

@media (orientation:landscape){
  #tp-splash{padding:1.5rem 4rem 2.5rem}
  .tp-splash__top{padding:1.2rem 2.4rem;gap:1.8rem}
  .tp-logo{width:6.5rem}
  .tp-org .tp-welcome{font-size:2.2rem}
  .tp-splash__mid{margin-top:1rem;gap:.4rem}
  .tp-hero{font-size:6.8rem}
  .tp-hero__sup{font-size:2.5rem;margin-bottom:.1rem}
  .tp-hero__sub{font-size:3.0rem;margin-top:.1rem}
  .tp-splash__bot{gap:1.4rem;padding-top:.8rem}
  .tp-choose{font-size:1.24rem}
  .tp-langs{gap:2.4rem;flex-wrap:nowrap}
  .tp-lang{width:16.5rem;height:12.6rem;border-radius:8.2rem 8.2rem 1.2rem 1.2rem;padding-bottom:1.9rem}
  .tp-lang__code{font-size:3.3rem;padding-top:2.4rem}
  .tp-lang__name{font-size:1.24rem}
}


.tp-welcome{
  font-family:var(--tp-display);
  font-weight:600;
  font-size:2.5rem;letter-spacing:.22em;
  color:var(--tp-gold-hi);text-transform:uppercase;
  line-height:1.2;
}
.tp-menu__footer{
  display:flex;justify-content:center;align-items:center;
  padding:1rem 2rem 2.2rem;width:100%;flex:0 0 auto;
}

/* ============ ШАПКА ВНУТРЕННИХ ЭКРАНОВ ============ */
.tp-head{
  display:flex;align-items:center;gap:2.2rem;
  padding:2rem 3.4rem;
  border-bottom:1px solid rgba(212,175,110,.35);
  background:linear-gradient(135deg, rgba(16, 31, 56, 0.85) 0%, rgba(11, 22, 40, 0.70) 50%, rgba(7, 14, 26, 0.92) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 1rem 3rem rgba(0,0,0,.5);
  flex:0 0 auto;
}
.tp-head__logo{width:5.4rem;height:auto;flex:0 0 auto}
.tp-head__txt{flex:1;min-width:0;text-align:left}
.tp-head__org{
  font-family:var(--tp-display);
  font-size:1.02rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--tp-text-dim);line-height:1.7;
}
.tp-head__name{
  font-family:var(--tp-display);
  font-size:1.72rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tp-gold-hi);margin-top:.35rem;
}
.tp-head__tools{display:flex;align-items:center;gap:1rem;flex:0 0 auto}

.tp-pill{
  padding:.85rem 1.6rem;border:1px solid var(--tp-line);border-radius:.5rem;
  font-size:1.12rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tp-text-dim);
  transition:all .25s;
}
.tp-pill.is-on{color:var(--tp-navy-900);background:linear-gradient(180deg,var(--tp-gold-hi),var(--tp-gold-deep));border-color:transparent;font-weight:600}
.tp-pill:active{transform:scale(.94)}

.tp-icobtn{
  width:5.4rem;height:5.4rem;border:1px solid var(--tp-line);border-radius:.6rem;
  display:flex;align-items:center;justify-content:center;transition:all .25s;
}
.tp-icobtn svg{width:2.4rem;height:2.4rem;stroke:var(--tp-gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tp-icobtn:active{transform:scale(.92)}
.tp-icobtn:hover{border-color:var(--tp-gold);background:rgba(216,178,108,.09)}

/* ============ ЭКРАН 2 — МЕНЮ ============ */
#tp-menu{padding:0}
.tp-menu__body{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.4rem;padding:2.2rem 3.6rem 1.5rem;min-height:0;
  overflow-y:auto;
}
.tp-menu__title{
  font-family:var(--tp-display);
  font-size:3.5rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--tp-sand);text-align:center;
  animation:tp-fade-down .7s both;
}
.tp-menu__sub{
  font-size:1.45rem;letter-spacing:.26em;text-transform:uppercase;color:var(--tp-text-dim);
  margin-top:1.1rem;
}
.tp-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:2.4rem;
  width:100%;max-width:100rem;
}
.tp-grid .tp-card{grid-column:span 2}
.tp-grid .tp-card:nth-child(4){grid-column:2 / span 2}
@media (orientation:landscape){
  .tp-grid{grid-template-columns:repeat(5,1fr);max-width:162rem;gap:1.9rem}
  .tp-grid .tp-card,
  .tp-grid .tp-card:nth-child(4){grid-column:auto}
}

.tp-card{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.5rem;padding:3.4rem 1.6rem;
  min-height:25rem;
  background:linear-gradient(170deg,rgba(22,41,74,.86) 0%,rgba(11,21,38,.92) 100%);
  border:1px solid var(--tp-line);border-radius:1.4rem;
  box-shadow:var(--tp-shadow);
  text-align:center;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.2), border-color .3s, box-shadow .3s;
  animation:tp-fade-up .8s both;
}
.tp-card:nth-child(1){animation-delay:.10s}
.tp-card:nth-child(2){animation-delay:.20s}
.tp-card:nth-child(3){animation-delay:.30s}
.tp-card:nth-child(4){animation-delay:.40s}
.tp-card:nth-child(5){animation-delay:.50s}
.tp-card::after{
  content:"";position:absolute;inset:0;border-radius:1.4rem;pointer-events:none;
  background:radial-gradient(70% 50% at 50% 0%, rgba(216,178,108,.16), transparent 70%);
  opacity:0;transition:opacity .35s;
}
.tp-card:hover{border-color:rgba(212,175,110,.8);box-shadow:0 1.6rem 4rem rgba(0,0,0,.65),0 0 3.4rem rgba(216,178,108,.16)}
.tp-card:hover::after{opacity:1}
.tp-card:active{transform:scale(.975)}

.tp-arch{position:relative;width:9.6rem;height:10.8rem;flex:0 0 auto}
.tp-arch__frame{position:absolute;inset:0;width:100%;height:100%}
.tp-arch__frame path{fill:none;stroke:var(--tp-gold);stroke-width:3.4;stroke-linecap:round}
.tp-arch__ico{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:4.6rem;height:4.6rem;
  fill:none;stroke:var(--tp-gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.tp-card__num{
  font-family:var(--tp-display);font-size:1.2rem;letter-spacing:.4em;
  color:var(--tp-gold-deep);
}
.tp-card__title{
  font-family:var(--tp-display);
  max-width:100%;
  font-size:1.74rem;line-height:1.35;letter-spacing:.09em;
  color:var(--tp-gold-hi);text-transform:uppercase;
}

/* ============ АНИМАЦИИ ============ */
@keyframes tp-fade-up{from{opacity:0;transform:translateY(3.2rem)}to{opacity:1;transform:none}}
@keyframes tp-fade-down{from{opacity:0;transform:translateY(-2.4rem)}to{opacity:1;transform:none}}
@keyframes tp-pulse{0%,100%{opacity:.55}50%{opacity:1}}
.tp-hint{
  position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);
  font-size:1.2rem;letter-spacing:.3em;text-transform:uppercase;color:var(--tp-text-dim);
  animation:tp-pulse 2.6s infinite;
}

@media (min-width: 2500px) {
  html { font-size: clamp(24px, calc(0.65vw + 0.65vh), 42px); }
  .tp-grid { max-width: 220rem; gap: 3.2rem; }
  .tp-card { min-height: 32rem; padding: 4.5rem 2.5rem; }
  .tp-menu__body { gap: 3.5rem; padding-top: 3rem; }
  .tp-menu__footer { padding-bottom: 3rem; }
}


/* ================= ВЕРТИКАЛЬНЫЙ КИОСК 1080x1920 ================= */
.tp-hero__sup{font-size:2.1rem;letter-spacing:.36em;padding-left:.36em;margin-bottom:.4rem}
.tp-hero{font-size:5.2rem;letter-spacing:.05em;line-height:1.06}
.tp-hero__sub{font-size:1.42rem;letter-spacing:.24em;padding-left:.24em;margin-top:.6rem;line-height:1.5}
#tp-splash{padding-top:.8rem}
.tp-splash__top{margin-top:0}
/* сдвиг трансформом: поток не меняется, блоки не наезжают.
   !important — анимация появления с fill-mode:both перебивает обычные правила */
.tp-splash__mid{justify-content:center;transform:translateY(-3vh)!important}
.tp-splash__bot{transform:none!important;padding-bottom:4vh;gap:1.6rem}
.tp-langhint{
  font-family:var(--tp-display);font-size:1.15rem;letter-spacing:.32em;
  text-transform:uppercase;color:var(--tp-text-dim);opacity:.92;
  padding-left:.32em;text-shadow:0 .1rem .3rem rgba(0,0,0,.6);
}
.tp-langs{gap:2.6rem;max-width:70rem;margin:0 auto}
.tp-lang{width:14.2rem;height:11.4rem;padding-bottom:1.6rem;gap:.4rem;
  border-radius:7.1rem 7.1rem 1rem 1rem}
.tp-lang__code{font-size:2.9rem;padding-top:2rem;letter-spacing:.12em}
.tp-lang__flagline{width:3.6rem;margin:.55rem 0 .15rem}
.tp-lang__name{font-size:1.06rem;letter-spacing:.22em}

/* --- вертикальный экран: карточки в сетку 2+2+1 --- */
@media (max-aspect-ratio:1/1){
  .tp-hero{font-size:6.4rem}
  .tp-hero__sup{font-size:2.3rem}
  .tp-hero__sub{font-size:1.55rem}
  .tp-splash__mid{transform:translateY(-5vh)!important}
  .tp-head{padding:2.4rem 3rem}
  .tp-menu__body{padding:2.6vh 4vw 2.6vh;gap:2.4vh;justify-content:center;overflow:hidden}
  .tp-grid{
    display:grid!important;
    grid-template-columns:repeat(2,1fr);
    gap:2.2vh 3vw;
    width:100%;max-width:none;align-items:stretch;
  }
  .tp-grid .tp-card{grid-column:span 1!important;width:auto;height:100%;min-height:0;max-height:23vh}
  /* пятая карточка — во всю ширину */
  .tp-grid .tp-card:nth-child(5){grid-column:1 / -1!important;min-height:0;max-height:17vh}
  .tp-card__title{font-size:1.9rem;line-height:1.24}
  .tp-arch{width:12rem}
  .tp-langs{gap:3rem}
  .tp-lang{width:16rem;height:12.8rem;border-radius:8rem 8rem 1rem 1rem}
  .tp-lang__code{font-size:3.3rem;padding-top:2.3rem}
  .tp-lang__name{font-size:1.2rem}
  .tp-langhint{font-size:1.3rem}
}

/* ---- карточки одинаковой высоты: ровный ряд ---- */
.tp-grid{align-items:stretch}
.tp-grid .tp-card{height:100%}

/* ---- разделы в подготовке ---- */
.tp-card.is-soon{opacity:.62}
.tp-card.is-soon::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(135deg,rgba(212,178,90,.07) 0 12px,transparent 12px 24px);
}
#tp-toast{
  position:fixed;left:50%;bottom:9rem;transform:translate(-50%,1.2rem);z-index:60;
  padding:1.6rem 3.2rem;border-radius:1.2rem;
  background:rgba(10,17,32,.94);border:1px solid rgba(212,178,90,.55);
  color:#F0DCA8;font-size:2rem;letter-spacing:.18em;font-weight:700;white-space:nowrap;
  box-shadow:0 1.4rem 4rem rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .35s ease, transform .35s ease;
}
#tp-toast.is-on{opacity:1;transform:translate(-50%,0)}

/* ================= ОБЛОЖКА: «YANGI O‘ZBEKISTON YO‘LLARI» =================
   Новый заголовок на 3 знака длиннее прежнего «MAGISTRALLAR SARI»,
   поэтому кегль уменьшен на 15% — строка занимает ту же ширину,
   что и раньше, и не выходит за края экрана 1080 px.
   Специфичность (0,2,0) перебивает все базовые правила .tp-hero. */
.tp-splash__mid .tp-hero{font-size:4.42rem;white-space:nowrap}
@media (orientation:landscape){
  .tp-splash__mid .tp-hero{font-size:5.78rem}
}
@media (max-aspect-ratio:1/1){
  .tp-splash__mid .tp-hero{font-size:5.44rem}
}

/* Годы периода — отдельной строкой, мельче основного названия раздела.
   Так длинные заголовки с датами не разрастаются и карточка не переполняется. */
.tp-card__years{
  display:block;font-size:.68em;letter-spacing:.22em;
  opacity:.72;margin-top:.45em;font-weight:400;
}
@media (max-aspect-ratio:1/1){
  .tp-card__title{font-size:1.78rem}
}

/* ================= ТЕМА «ДОРОГИ НОВОГО УЗБЕКИСТАНА» =================
   Новый фон — светлый дневной снимок развязки, поэтому:
   1) кадр приглушается фильтром до навигационной сине-золотой палитры;
   2) вуаль усилена в верхней и средней зонах — там лежит небо,
      на котором белый градиентный заголовок иначе теряет контраст. */
.tp-bg__img{filter:saturate(.84) contrast(1.06) brightness(.80)}
/* Кадр вертикальный (9:16). В горизонтальной раскладке он обрезается,
   поэтому точка привязки опускается к развязке — иначе в кадре одно небо. */
@media (orientation:landscape){
  .tp-bg__img{object-position:50% 76%;transform:none}
}
.tp-bg__veil{
  background:linear-gradient(180deg,
    rgba(6,12,22,.80) 0%,
    rgba(6,12,22,.64) 20%,
    rgba(6,12,22,.54) 44%,
    rgba(6,12,22,.62) 66%,
    rgba(5,10,20,.93) 100%);
}
body.tp-mode-inner .tp-bg__img{opacity:.34;filter:blur(1.4px) saturate(.8) brightness(.7)}

/* ================= ТИТУЛЬНЫЙ ЭКРАН: ЧИСТЫЙ КАДР =================
   Только сплеш (body без .tp-mode-inner): кадр не гасится по яркости
   и поднимается на 20% высоты экрана; вуаль — исходная, мягкая:
   тень по верхней и нижней кромке, чистое небо в середине.
   height:120% при top:-20% — чтобы низ кадра не оголил фон. */
body:not(.tp-mode-inner) .tp-bg__veil{
  background:linear-gradient(180deg,
    rgba(7,13,24,.45) 0%,
    rgba(7,13,24,.04) 34%,
    rgba(7,13,24,.30) 66%,
    rgba(7,13,24,.86) 100%);
}
body:not(.tp-mode-inner) .tp-bg__img{
  top:-20%;height:120%;
  filter:saturate(.86) contrast(1.05);
}

/* Заголовок обложки — две строки, перенос вручную через <br>,
   поэтому запрет переноса из блока «ОБЛОЖКА» снимается.
   Кегль подобран так, чтобы строка «YANGI O‘ZBEKISTON» не переносилась
   на экране 1080 px даже при подстановочной гарнитуре вместо Trajan Pro. */
.tp-splash__mid .tp-hero{white-space:normal;font-size:4.4rem;letter-spacing:.04em}
@media (orientation:landscape){
  .tp-splash__mid .tp-hero{font-size:5.2rem}
}
@media (max-aspect-ratio:1/1){
  .tp-splash__mid .tp-hero{font-size:4.8rem}
}
/* Прежний отрицательный отступ был рассчитан на однострочный заголовок
   и на старый кадр. Теперь блок центрируется между шапкой и выбором языка. */
.tp-splash__mid{margin-top:0!important}
.tp-hero__sub{margin-top:1.2rem}

/* Название раздела в меню длиннее прежнего — уменьшен кегль,
   ширина ограничена, строка переносится по словам. */
.tp-menu__title{font-size:2.9rem;letter-spacing:.16em;line-height:1.32;max-width:56rem;margin:0 auto}
@media (orientation:landscape){
  .tp-menu__title{font-size:3.1rem;max-width:none}
}

/* ================= ПРАВКИ СПЛЭША ================= */
/* только коды языков: UZ / RU / EN — без подписи и линии */
.tp-lang{justify-content:center;padding-bottom:0;gap:0}
.tp-lang__code{margin-top:0;padding-top:0}

/* главный заголовок: вписан в 1020px, отступ сверху 40px */
.tp-splash__mid{
  width:100%;max-width:1020px;
  margin:140px auto 0!important;
  padding:0 2rem;
  transform:none!important;
  justify-content:flex-start;
  gap:1.4rem;
  /* базовая анимация tp-fade-up меняет и transform; вместе с transform:none!important
     Chrome теряет финальный кадр и блок остаётся невидимым — здесь только opacity */
  animation:tp-mid-in .9s .35s both!important;
}
@keyframes tp-mid-in{from{opacity:0}to{opacity:1}}
.tp-splash__mid .tp-hero{font-size:min(7.2vw,76px);line-height:1.08;letter-spacing:.04em}
.tp-splash__mid .tp-hero__sup{font-size:min(2.6vw,28px)}
.tp-splash__mid .tp-hero__sub{font-size:min(2.4vw,26px);letter-spacing:.28em;padding-left:.28em;margin-top:.4rem}

/* ================= МЕНЮ: 2 КАРТОЧКИ СВЕРХУ, 3 СНИЗУ ================= */
.tp-grid{
  display:grid!important;
  grid-template-columns:repeat(6,1fr)!important;
  max-width:126rem;gap:2.2rem;
}
/* нижний ряд — три карточки по 2 колонки */
.tp-grid .tp-card,
.tp-grid .tp-card:nth-child(3),
.tp-grid .tp-card:nth-child(4),
.tp-grid .tp-card:nth-child(5){grid-column:span 2!important}
/* верхний ряд — две карточки той же ширины, что и нижние,
   по центру сетки: колонки 2-3 и 4-5 из шести */
.tp-grid .tp-card:nth-child(1){grid-column:2 / span 2!important}
.tp-grid .tp-card:nth-child(2){grid-column:4 / span 2!important}

/* иконка прижата к верху: одна линия для всех карточек,
   независимо от длины заголовка */
.tp-card{justify-content:flex-start;gap:1.2rem;padding:2.6rem 1.6rem 2.4rem}
.tp-arch{width:8.4rem;height:9.4rem}
.tp-card{min-height:0}
.tp-grid{grid-auto-rows:minmax(0,1fr)}
/* заголовки карточек: кегль уменьшен, чтобы длинные слова
   («BIRLASHTIRGAN», «МЕЖДУНАРОДНЫЕ») не упирались в края карточки */
.tp-card__title{font-size:1.4rem;letter-spacing:.05em;line-height:1.32;overflow-wrap:break-word}
@media (orientation:landscape){
  .tp-card__title{font-size:1.46rem;letter-spacing:.05em}
}

/* контейнер карточек прижат к низу, заголовок центрируется по высоте
   свободного пространства между шапкой и карточками */
.tp-menu__body{justify-content:flex-end}
.tp-menu__title{
  flex:1 1 auto;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tp-grid{flex:0 0 auto}

/* горизонтальная раскладка: два ряда карточек должны уместиться по высоте */
@media (orientation:landscape){
  .tp-menu__body{gap:1.6rem;padding:1.6rem 3rem 1.2rem}
  .tp-grid{gap:1.6rem}
  .tp-grid .tp-card{max-height:30vh;padding:1.8rem 1.4rem 1.6rem;gap:.8rem}
  .tp-arch{width:6.4rem;height:7.2rem}
  .tp-arch__ico{width:3rem;height:3rem}
}
.tp-arch__ico{width:4rem;height:4rem}

@media (max-aspect-ratio:1/1){
  .tp-grid .tp-card,
  .tp-grid .tp-card:nth-child(5){min-height:0;max-height:26vh!important;height:100%}
}
html,body{touch-action:pan-x pan-y}
</style>

/* ==================================================================
   ЛОГИКА
   ================================================================== */
(function(){
  var lang = 'uz';
  var IDLE_MS = 300000;   /* 5 минут бездействия -> блокировка и экран выбора языка */
  var idleTimer = null;

  var $  = function(s){ return document.querySelector(s); };
  var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var grid = $('#tp-grid');

  function showScreen(id){
    $$('.tp-screen').forEach(function(s){ s.classList.remove('is-active'); });
    $(id).classList.add('is-active');
    document.body.classList.toggle('tp-mode-inner', id !== '#tp-splash');
    resetIdle();
  }

  /* титульный экран — сам по себе состояние покоя, блокировать нечего */
  function isSplashActive(){
    var s = document.getElementById('tp-splash');
    return !!s && s.classList.contains('is-active');
  }

  function archSVG(iconKey){
    return '<div class="tp-arch">' +
      '<svg class="tp-arch__frame" viewBox="0 0 110 122" preserveAspectRatio="xMidYMid meet">' +
        '<path d="' + TP_ARCH_PATH + '"/>' +
      '</svg>' +
      '<svg class="tp-arch__ico" viewBox="0 0 24 24">' + TP_ICONS[iconKey] + '</svg>' +
    '</div>';
  }

  function renderMenu(){
    var d = TP_DATA[lang];
    if ($('#tp-head-welcome')) $('#tp-head-welcome').textContent = d.welcome;
    if ($('#tp-splash-welcome')) $('#tp-splash-welcome').textContent = d.welcome;
    $('#tp-menu-title').textContent = d.menuTitle;
    $('#tp-menu-sub').textContent   = d.menuSub;

    var grid = $('#tp-grid');
    grid.innerHTML = '';
    d.sections.forEach(function(sec, i){
      var b = document.createElement('button');
      b.className = 'tp-card';
      b.setAttribute('data-index', i);
      if (sec.href) {
        b.setAttribute('data-href', sec.href);
      }
      if (sec.ready === 0) { b.setAttribute('data-ready','0'); b.classList.add('is-soon'); }
      b.innerHTML =
        archSVG(sec.icon) +
        '<div class="tp-card__num">' + sec.num + '</div>' +
        '<div class="tp-card__title">' + sec.title + '</div>';
      grid.appendChild(b);
    });

    $$('.tp-pill').forEach(function(p){
      p.classList.toggle('is-on', p.getAttribute('data-lang') === lang);
    });
  }

  /* --- язык: чтение / сохранение выбора --- */
  function bipReadLang(){
    var l = null;
    try { l = new URLSearchParams(window.location.search).get('lang'); } catch(e){}
    if (l !== 'uz' && l !== 'ru' && l !== 'en') {
      l = null;
      try { l = window.localStorage.getItem('bipLang'); } catch(e){}
    }
    return (l === 'uz' || l === 'ru' || l === 'en') ? l : null;
  }
  function bipSaveLang(l){
    try { window.localStorage.setItem('bipLang', l); } catch(e){}
  }
  /* добавляет ?lang= к ссылке раздела, сохраняя #hash */
  function withLang(href){
    var hash = '', i = href.indexOf('#');
    if (i !== -1) { hash = href.slice(i); href = href.slice(0, i); }
    href += (href.indexOf('?') === -1 ? '?' : '&') + 'lang=' + lang;
    return href + hash;
  }

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    bipSaveLang(l);
    renderMenu();
  }

  /* --- выбор языка на первом экране --- */
  $$('.tp-lang').forEach(function(b){
    b.addEventListener('click', function(){
      setLang(b.getAttribute('data-lang'));
      showScreen('#tp-menu');
    });
  });

  /* --- переключение языка в шапке --- */
  $$('.tp-pill').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
  });

  /* --- всплывающая подсказка для готовящихся разделов --- */
  var tpToastT = null;
  function tpToast(msg){
    var el = document.getElementById('tp-toast');
    if (!el) { el = document.createElement('div'); el.id='tp-toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.classList.add('is-on');
    if (tpToastT) clearTimeout(tpToastT);
    tpToastT = setTimeout(function(){ el.classList.remove('is-on'); }, 2600);
  }

  /* --- переход по карточкам меню --- */
  grid.addEventListener('click', function(e){
    var card = e.target.closest('.tp-card');
    if (!card) return;
    var href = card.getAttribute('data-href');
    if (card.getAttribute('data-ready') === '0') { tpToast(TP_DATA[lang].soon); return; }
    if (href) {
      var url = withLang(href);
      setTimeout(function(){ window.location.href = url; }, 150);
    }
  });

  /* --- на титульный экран --- */
  $('#tp-home').addEventListener('click', function(){ showScreen('#tp-splash'); });


  /* блокировка по бездействию: экран гаснет и возвращается к выбору языка */
  function tpLock(done){
    var v=document.getElementById('tp-lock');
    if(!v){
      v=document.createElement('div'); v.id='tp-lock';
      v.style.cssText='position:fixed;inset:0;z-index:900;background:#070d18;opacity:0;'+
                      'transition:opacity .45s ease;pointer-events:none';
      document.body.appendChild(v);
    }
    v.style.pointerEvents='all'; v.style.opacity='1';
    setTimeout(function(){
      done();
      v.style.opacity='0'; v.style.pointerEvents='none';
    }, 520);
  }
  /* --- сброс по бездействию --- */
  function resetIdle(){
    clearTimeout(idleTimer);
    idleTimer = null;
    if (isSplashActive()) return;
    idleTimer = setTimeout(function(){
      if (isSplashActive()) return;
      tpLock(function(){ setLang(lang); showScreen('#tp-splash'); });
    }, IDLE_MS);
  }
  ['pointerdown','touchstart','mousemove','wheel','keydown'].forEach(function(ev){
    document.addEventListener(ev, resetIdle, {passive:true});
  });

  /* --- поведение сенсорной панели --- */
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

  var bipSaved = bipReadLang();
  if (bipSaved) { lang = bipSaved; document.documentElement.lang = bipSaved; }
  bipSaveLang(lang);

  renderMenu();
  resetIdle();

  function checkHashNav(){
    if (window.location.hash === '#tp-menu' || window.location.hash === '#menu' || window.location.search.indexOf('menu') !== -1) {
      showScreen('#tp-menu');
    } else if (window.location.hash === '#tp-splash' || window.location.hash === '#splash') {
      showScreen('#tp-splash');
    }
  }

  window.addEventListener('hashchange', checkHashNav);
  checkHashNav();
})();
</script>
<script>
/* КИОСК: запрет масштабирования — щипок двумя пальцами, двойной тап,
   Ctrl+колесо и Ctrl +/-/0 */
(function(){
  var stop=function(e){ e.preventDefault(); };
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    document.addEventListener(t,stop,{passive:false});
  });
  document.addEventListener('touchmove',function(e){
    if(e.touches && e.touches.length>1) e.preventDefault();
  },{passive:false});
  document.addEventListener('wheel',function(e){
    if(e.ctrlKey) e.preventDefault();
  },{passive:false});
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey) && ['+','-','=','_','0'].indexOf(e.key)!==-1) e.preventDefault();
  });
  var last=0;
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(now-last<=350) e.preventDefault();
    last=now;
  },{passive:false});
})();
</script>
<script>
/* КИОСК: по первому касанию разворачиваем во весь экран */
(function(){
  function go(){
    document.removeEventListener('pointerdown',go,true);
    try{
      var el=document.documentElement;
      if(!document.fullscreenElement && el.requestFullscreen){
        var p=el.requestFullscreen();
        if(p&&p.catch) p.catch(function(){});
      }
    }catch(e){}
  }
  document.addEventListener('pointerdown',go,true);
})();
</script>
